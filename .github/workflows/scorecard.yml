name: Scorecard analysis

# Runs OpenSSF Scorecard supply-chain analysis directly via ossf/scorecard-action
# (no composite wrapper, no cross-org dependency). All action refs are SHA-pinned.
#
# Scorecard requirements
# ──────────────────────
# • Supported triggers (per OSSF) are push and schedule on the default branch.
#   workflow_dispatch provides manual re-runs after this workflow exists on the default branch.
#   OSSF officially documents it as EXPERIMENTAL ("The pull_request and workflow_dispatch
#   triggers are experimental" — scorecard-action README), so treat a manual run as a smoke
#   signal only. There is no pull_request trigger: Scorecard scores the repository, not the
#   diff, so a per-PR run adds nothing, and Dependabot PRs get a read-only token that cannot
#   upload the SARIF. This workflow is fully validated only after merge to the default branch.
# • The checkout step MUST set persist-credentials: false (required by Scorecard's
#   security model to avoid leaking the GITHUB_TOKEN into the analysis environment).
# • publish_results: true publishes to the public Scorecard API and enables the
#   Scorecard badge. It requires id-token: write on the job AND a push/schedule
#   event — it must stay false on pull_request/workflow_dispatch. Set to 'false' to
#   keep results private (id-token can then be omitted from the job permissions).

on:
  push:
    branches: ['master']
  workflow_dispatch: {}              # EXPERIMENTAL per OSSF: manual re-run, available only after merge (default-branch copy)
  schedule:
    - cron: '30 1 * * 6'   # weekly, Saturday 01:30 UTC

permissions: read-all   # default: restrict everything; the job overrides what it needs

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Keep publish_results: false on workflow_dispatch — publishing requires a push/schedule
    # event and id-token: write.
    permissions:
      security-events: write   # upload SARIF to the Security tab / Code Scanning dashboard
      # id-token: write           # OIDC token for Scorecard's public API publishing (publish_results: true)
                                # Uncomment this line only when you set publish_results: true
      contents: read            # checkout the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false   # required by Scorecard — do not remove

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true publishes to the Scorecard public dataset and enables the badge.
          # Requires id-token: write above and a push/schedule event.
          # Set to 'true' (and enable id-token: write) to publish results to the Scorecard public dataset.
          publish_results: false

      # Upload SARIF to GitHub Code Scanning dashboard (optional — comment out to disable).
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
