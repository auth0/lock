name: RL Scan
run-name: rl-scan

# Reusable malware-scan workflow, called from npm-release.yml before anything is published.
#
# It builds the release artifacts exactly the way the publish step does (npm ci, npm run build)
# and scans both of them with the ReversingLabs rl-scan action:
#   1. the npm tarball (npm pack)        -> what gets published to the npm registry
#   2. the CDN bundle (tar of build/)    -> lock.min.js, lock.js, locale files and source map
#
# The calling job must be a `needs:` dependency of the publish job so a failed scan blocks the release.
#
# Required org secrets (configured at org level in auth0/):
#   RLSECURE_LICENSE            — ReversingLabs license key
#   RLSECURE_SITE_KEY           — ReversingLabs site key
#   SIGNAL_HANDLER_TOKEN        — scan-service telemetry auth
#   SIGNAL_HANDLER_DOMAIN       — scan-service endpoint domain
#   PRODSEC_TOOLS_ARN           — AWS role ARN for ProdSec tools
#   PRODSEC_TOOLS_USER          — ProdSec Python tools repo user
#   PRODSEC_TOOLS_TOKEN         — ProdSec Python tools repo token
#   PRODSEC_PYTHON_TOOLS_REPO   — ProdSec Python tools repo URL

on:
  # TEMPORARY: lets the scan run on the PR that changes this file, for testing. Remove before merging.
  pull_request:
    paths:
      - .github/workflows/rl.yml
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to build the artifacts (should match the release job)
        type: string
        required: true
    secrets:
      RLSECURE_LICENSE:
        required: true
      RLSECURE_SITE_KEY:
        required: true
      SIGNAL_HANDLER_TOKEN:
        required: true
      SIGNAL_HANDLER_DOMAIN:
        required: true
      PRODSEC_TOOLS_ARN:
        required: true
      PRODSEC_TOOLS_USER:
        required: true
      PRODSEC_TOOLS_TOKEN:
        required: true
      PRODSEC_PYTHON_TOOLS_REPO:
        required: true

jobs:
  rl-scan:
    name: RL Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for AWS OIDC federation (PRODSEC_TOOLS_ARN)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version || '22' }} # '22' fallback only applies to the temporary pull_request trigger
          check-latest: true
          cache: npm

      # Same sequence as the npm-publish action: npm ci also runs `prepublish`, which builds lib/
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build package
        run: npm run build

      - name: Package artifacts
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/rl-artifacts"
          NPM_TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP/rl-artifacts" --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")
          CDN_BUNDLE="auth0-lock-cdn-bundle-${VERSION}.tgz"
          tar -czf "$RUNNER_TEMP/rl-artifacts/${CDN_BUNDLE}" -C build .
          {
            echo "version=${VERSION}"
            echo "npm-tarball=$RUNNER_TEMP/rl-artifacts/${NPM_TARBALL}"
            echo "cdn-bundle=$RUNNER_TEMP/rl-artifacts/${CDN_BUNDLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Run RL malware scan (npm tarball)
        id: rl-scan-npm
        uses: auth0/devsecops-tooling/.github/actions/rl-scan@e29f26478db18ff0bcbe4bc447a8fbd54fbeec9e
        with:
          artifact-name: auth0-lock
          artifact-path: ${{ steps.package.outputs.npm-tarball }}
          version: ${{ steps.package.outputs.version }}
          RLSECURE_LICENSE: ${{ secrets.RLSECURE_LICENSE }}
          RLSECURE_SITE_KEY: ${{ secrets.RLSECURE_SITE_KEY }}
          SIGNAL_HANDLER_TOKEN: ${{ secrets.SIGNAL_HANDLER_TOKEN }}
          SIGNAL_HANDLER_DOMAIN: ${{ secrets.SIGNAL_HANDLER_DOMAIN }}
          PRODSEC_TOOLS_ARN: ${{ secrets.PRODSEC_TOOLS_ARN }}
          PRODSEC_TOOLS_USER: ${{ secrets.PRODSEC_TOOLS_USER }}
          PRODSEC_TOOLS_TOKEN: ${{ secrets.PRODSEC_TOOLS_TOKEN }}
          PRODSEC_PYTHON_TOOLS_REPO: ${{ secrets.PRODSEC_PYTHON_TOOLS_REPO }}

      - name: Run RL malware scan (CDN bundle)
        id: rl-scan-cdn
        if: always() && steps.package.outcome == 'success'
        uses: auth0/devsecops-tooling/.github/actions/rl-scan@e29f26478db18ff0bcbe4bc447a8fbd54fbeec9e
        with:
          artifact-name: auth0-lock-cdn-bundle
          artifact-path: ${{ steps.package.outputs.cdn-bundle }}
          version: ${{ steps.package.outputs.version }}
          RLSECURE_LICENSE: ${{ secrets.RLSECURE_LICENSE }}
          RLSECURE_SITE_KEY: ${{ secrets.RLSECURE_SITE_KEY }}
          SIGNAL_HANDLER_TOKEN: ${{ secrets.SIGNAL_HANDLER_TOKEN }}
          SIGNAL_HANDLER_DOMAIN: ${{ secrets.SIGNAL_HANDLER_DOMAIN }}
          PRODSEC_TOOLS_ARN: ${{ secrets.PRODSEC_TOOLS_ARN }}
          PRODSEC_TOOLS_USER: ${{ secrets.PRODSEC_TOOLS_USER }}
          PRODSEC_TOOLS_TOKEN: ${{ secrets.PRODSEC_TOOLS_TOKEN }}
          PRODSEC_PYTHON_TOOLS_REPO: ${{ secrets.PRODSEC_PYTHON_TOOLS_REPO }}

      # The action reports a missing artifact via its output without failing the step, so gate explicitly
      - name: Gate on scan results
        if: always()
        env:
          NPM_STATUS: ${{ steps.rl-scan-npm.outputs.scan-status }}
          CDN_STATUS: ${{ steps.rl-scan-cdn.outputs.scan-status }}
        run: |
          failed=0
          if [ "$NPM_STATUS" != "success" ]; then
            echo "::error title=Malware::RL scan of the npm tarball did not pass (status: ${NPM_STATUS:-none})"
            failed=1
          fi
          if [ "$CDN_STATUS" != "success" ]; then
            echo "::error title=Malware::RL scan of the CDN bundle did not pass (status: ${CDN_STATUS:-none})"
            failed=1
          fi
          exit $failed
